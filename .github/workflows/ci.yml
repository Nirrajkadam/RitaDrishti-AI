name: RitaDrishti-AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  JWT_SECRET: ci-only-secret-key-2026-testing-0123456789
  POSTGRES_PASSWORD: ci-only-password

jobs:
  backend-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ritadrishti
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ritadrishti_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov

      - name: Run Alembic Migration on PostgreSQL
        env:
          DATABASE_URL: "postgresql+asyncpg://ritadrishti:ci-only-password@localhost:5432/ritadrishti_test_db"
        run: |
          alembic -c backend/alembic.ini upgrade head

      - name: Run Pytest Suite with PostgreSQL & Coverage Enforcement (>=85%)
        env:
          DATABASE_URL: "postgresql+asyncpg://ritadrishti:ci-only-password@localhost:5432/ritadrishti_test_db"
          APP_ENV: "testing"
          JWT_SECRET: "ci-only-secret-key-2026-testing-0123456789"
        run: |
          pytest backend/tests/ -v --cov=backend/app --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Validate Docker Compose Configuration & Startup Health
        run: |
          docker compose config --quiet
          cp .env.example .env
          docker compose up -d --build --wait
          curl --fail --retry 10 --retry-delay 2 http://localhost:8000/readyz

      - name: Clean up Docker Compose
        if: always()
        run: docker compose down -v

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Audit Frontend Dependencies
        working-directory: frontend
        run: |
          npm audit --omit=dev --audit-level=moderate
          npm audit

      - name: Verify Next.js Production Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"
        run: |
          npm run build
