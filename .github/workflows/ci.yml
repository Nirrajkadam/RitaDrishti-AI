name: RitaDrishti-AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ritadrishti
          POSTGRES_PASSWORD: ritadrishti_secret
          POSTGRES_DB: ritadrishti_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Machine Learning Model Training & Artifact Verification
        run: |
          python backend/app/ml/train_fake_review_model.py

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: "postgresql+asyncpg://ritadrishti:ritadrishti_secret@localhost:5432/ritadrishti_test_db"
          APP_ENV: "testing"
          JWT_SECRET: "ci_test_secret_key_1234567890_ritadrishti"
        run: |
          pytest backend/tests/ -v --tb=short
