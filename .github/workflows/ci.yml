name: RitaDrishti-AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ritadrishti
          POSTGRES_PASSWORD: ritadrishti_secret
          POSTGRES_DB: ritadrishti_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov

      - name: Execute Machine Learning Model Training & Checksum Verification
        run: |
          python backend/app/ml/train_fake_review_model.py

      - name: Run Alembic Migration on PostgreSQL
        env:
          DATABASE_URL: "postgresql+asyncpg://ritadrishti:ritadrishti_secret@localhost:5432/ritadrishti_test_db"
        run: |
          alembic -c backend/alembic.ini upgrade head

      - name: Run Pytest Suite with PostgreSQL & Coverage Enforcement (>=80%)
        env:
          DATABASE_URL: "postgresql+asyncpg://ritadrishti:ritadrishti_secret@localhost:5432/ritadrishti_test_db"
          APP_ENV: "testing"
          JWT_SECRET: "ci_test_secret_key_1234567890_ritadrishti"
        run: |
          pytest backend/tests/ -v --cov=backend/app --cov-fail-under=80

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Verify Next.js Production Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"
        run: |
          npm run build
