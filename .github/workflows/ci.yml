name: RitaDrishti-AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  JWT_SECRET: ci-only-secret-key-2026-testing-0123456789
  POSTGRES_PASSWORD: ci-only-password

jobs:
  backend-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ritadrishti
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ritadrishti_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run Alembic Migration on PostgreSQL
        env:
          DATABASE_URL: "postgresql+asyncpg://ritadrishti:ci-only-password@localhost:5432/ritadrishti_test_db"
        run: |
          alembic -c backend/alembic.ini upgrade head

      - name: Run Pytest Suite with PostgreSQL & Coverage Enforcement (>=85%)
        env:
          DATABASE_URL: "postgresql+asyncpg://ritadrishti:ci-only-password@localhost:5432/ritadrishti_test_db"
          APP_ENV: "testing"
          JWT_SECRET: "ci-only-secret-key-2026-testing-0123456789"
        run: |
          pytest backend/tests/ -v --cov=backend/app --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=85


  compose-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Validate Compose configurations
        run: |
          docker compose -f compose.yaml config --quiet
          JWT_SECRET=ci-production-secret \
          POSTGRES_PASSWORD=ci-production-password \
          docker compose \
            -f compose.yaml \
            -f compose.production.yaml \
            config --quiet

      - name: Start core stack
        run: |
          docker compose up \
            -d \
            --build \
            --wait \
            --wait-timeout 240 \
            postgres backend frontend

      - name: Verify readiness
        run: |
          curl --fail --retry 10 --retry-delay 2 \
            http://localhost:8000/readyz
          curl --fail --retry 10 --retry-delay 2 \
            http://localhost:3000/

      - name: Capture container diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Clean up
        if: always()
        run: docker compose down -v

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Audit Frontend Dependencies
        working-directory: frontend
        run: |
          npm audit --omit=dev --audit-level=moderate
          npm audit

      - name: Verify Next.js Production Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"
        run: |
          npm run build
