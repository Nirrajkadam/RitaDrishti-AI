services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured for production}

  backend:
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://ritadrishti:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured for production}@postgres:5432/ritadrishti_trust_db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured for production}
