version: '3.8'

services:
  # 1. PostgreSQL 16 Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: RitaDrishti_postgres
    restart: always
    environment:
      POSTGRES_USER: ritadrishti
      POSTGRES_PASSWORD: ritadrishti_secret
      POSTGRES_DB: ritadrishti_trust_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ritadrishti -d ritadrishti_trust_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.8.0
    container_name: RitaDrishti_qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # 3. FastAPI Async Backend API Gateway
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: RitaDrishti_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://ritadrishti:ritadrishti_secret@postgres:5432/ritadrishti_trust_db
      JWT_SECRET: ritadrishti_dev_secret_change_in_production_2026
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      ENABLE_OLLAMA: "false"
      ENABLE_CREWAI: "false"
      ENABLE_QDRANT: "false"
    depends_on:
      postgres:
        condition: service_healthy

  # 4. Next.js Enterprise Web Interface
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    container_name: RitaDrishti_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend

  # 5. Streamlit Interactive Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: RitaDrishti_dashboard
    restart: always
    command: ["streamlit", "run", "/app/dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data:
